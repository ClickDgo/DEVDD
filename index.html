, "SECCION": 1484, "TIPO": 2, "CONTROL": 2268, "GEOMETRY1_": NaN, "PAN": 0.168949771689498, "PRI": 0.191780821917808, "PVEM": 0.009132420091324, "PT": 0.015981735159817, "MC": 0.356164383561644, "MORENA": 0.157534246575342, "PARTICIPAC": 0.196677144140099}, {"ID": 1390, "ENTIDAD": 10, "DISTRITO_F": 1, "DISTRITO_L": 3, "MUNICIPIO": 5, "SECCION": 1485, "TIPO": 2, "CONTROL": 2266, "GEOMETRY1_": NaN, "PAN": 0.214953271028037, "PRI": 0.242990654205607, "PVEM": 0.012461059190031, "PT": 0.015576323987539, "MC": 0.358255451713396, "MORENA": 0.093457943925234, "PARTICIPAC": 0.244292237442922}];

        const coloresMap = {
            'PAN': '#0055A5',
            'PRI': '#E11417',
            'PVEM': '#76B82A',
            'PT': '#8B0000',
            'MC': '#FF8200',
            'MORENA': '#800020',
            'PARTICIPACION': '#800080'
        };

        function inicializar() {
            actualizarDistritos();
        }

        function actualizarDistritos() {
            const tipo = document.getElementById('tipoSelect').value;
            const distritoSelect = document.getElementById('distritoSelect');
            distritoSelect.innerHTML = '';
            
            let nums = (tipo === 'Federal') ? [1, 4] : [1, 2, 3, 4, 5, 6];
            nums.forEach(num => {
                let opt = document.createElement('option');
                opt.value = num;
                opt.textContent = num;
                distritoSelect.appendChild(opt);
            });
            actualizarSecciones();
        }

        function actualizarSecciones() {
            const tipo = document.getElementById('tipoSelect').value;
            const numDistrito = parseInt(document.getElementById('distritoSelect').value);
            const seccionSelect = document.getElementById('seccionSelect');
            seccionSelect.innerHTML = '';

            const colDistrito = (tipo === 'Federal') ? 'DISTRITO_F' : 'DISTRITO_L';
            
            let secciones = [];
            rawData.forEach(row => {
                if (row[colDistrito] !== undefined && row[colDistrito] !== null) {
                    if (parseInt(row[colDistrito]) === numDistrito) {
                        let sec = parseInt(row['SECCION']);
                        if (!secciones.includes(sec)) secciones.push(sec);
                    }
                }
            });
            secciones.sort((a, b) => a - b);

            secciones.forEach(sec => {
                let opt = document.createElement('option');
                opt.value = sec;
                opt.textContent = sec;
                seccionSelect.appendChild(opt);
            });
            actualizarTabla();
        }

        function actualizarTabla() {
            const tipo = document.getElementById('tipoSelect').value;
            const numDistrito = document.getElementById('distritoSelect').value;
            const seccionElement = document.getElementById('seccionSelect');
            if (!seccionElement.value) return;
            
            const seccion = parseInt(seccionElement.value);
            const row = rawData.find(r => parseInt(r['SECCION']) === seccion);
            if (!row) return;

            document.getElementById('tableTitle').textContent = `Resultados Electorales - Distrito ${tipo} #${numDistrito} (Sección ${seccion})`;

            const partidosLista = ['PAN', 'PRI', 'PVEM', 'PT', 'MC', 'MORENA'];
            let datosPartidos = [];

            partidosLista.forEach(p => {
                if (row[p] !== undefined && row[p] !== null) {
                    let porc = parseFloat(row[p]) * 100;
                    datosPartidos.push({ partido: p, valor: Math.round(porc * 100) / 100 });
                }
            });

            // Ordenar partidos de mayor a menor porcentaje
            datosPartidos.sort((a, b) => b.valor - a.valor);

            let participacionVal = 0.0;
            if (row['PARTICIPAC'] !== undefined && row['PARTICIPAC'] !== null) {
                participacionVal = Math.round(parseFloat(row['PARTICIPAC']) * 100 * 100) / 100;
            }

            const tbody = document.getElementById('tablaCuerpo');
            tbody.innerHTML = '';

            // Rellenar filas de partidos ordenados
            datosPartidos.forEach(item => {
                let color = coloresMap[item.partido] || '#333';
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="badge" style="background-color: ${color};"></span>${item.partido}</td>
                    <td style="text-align: right; font-weight: bold;">${item.valor.toFixed(2)}%</td>
                `;
                tbody.appendChild(tr);
            });

            // Agregar fila de Participación al final
            let partTr = document.createElement('tr');
            partTr.className = 'row-participacion';
            partTr.innerHTML = `
                <td><span class="badge" style="background-color: ${coloresMap['PARTICIPACION']};"></span>PARTICIPACIÓN</td>
                <td style="text-align: right;">${participacionVal.toFixed(2)}%</td>
            `;
            tbody.appendChild(partTr);
        }

        window.onload = inicializar;
    </script>
